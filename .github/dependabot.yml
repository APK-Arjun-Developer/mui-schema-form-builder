version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      storybook:
        patterns: ["@storybook/*", "storybook"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      testing:
        patterns: ["@testing-library/*", "vitest", "@vitest/*", "jest-axe", "@types/jest-axe"]
      typescript:
        patterns: ["typescript", "@types/*", "@typescript-eslint/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
