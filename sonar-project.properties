sonar.projectKey=APK-Arjun-Developer_mui-schema-form-builder
sonar.organization=apk-arjun-developer

sonar.projectName=mui-schema-form-builder
sonar.projectVersion=1.6.0

# Source files (library code only — excludes demo app and stories)
sonar.sources=src
sonar.exclusions=src/__tests__/**,src/stories/**,src/example/**,src/App.tsx,src/App.styles.ts,src/App.types.ts,src/main.tsx,src/index.css,src/vite-env.d.ts

# Test files
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.{ts,tsx}

# Coverage report (generated by vitest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
